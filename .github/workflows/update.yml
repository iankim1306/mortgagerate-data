name: Update mortgage rates

on:
  schedule:
    # Freddie Mac PMMS posts Thursdays ~noon ET; FRED updates shortly after.
    - cron: "0 19 * * 4"   # Thu 19:00 UTC (primary)
    - cron: "0 15 * * 5"   # Fri 15:00 UTC (backup, in case Thu data lagged)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch FRED & build rates.json
        run: python crawl.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json
          if git diff --staged --quiet; then
            echo "No change in rates.json"
          else
            git commit -m "data: update mortgage rates $(date -u +%Y-%m-%d)"
            git push
          fi
